[project]
name = "nara"
version = "0.1.0"
description = "Procurement notice violation detection competition"
requires-python = "==3.12.13"
dependencies = [
    "vllm==0.26.0",
    "torch==2.11.0+cu130",
    "transformers==5.14.1",
    "xgrammar==0.2.3",
    "jsonschema==4.26.0",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "openai==2.48.0",
    "pydantic==2.13.4",
    "numpy==2.2.6",
    "requests==2.34.2",
    "tqdm==4.69.1",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "sentencepiece==0.2.2",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.3.0",
    "kiwipiepy==0.21.0",
    "orjson==3.10.18",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
nara = "nara.cli:main"

[tool.setuptools]
packages = ["nara", "nara.inference", "nara.retrieval", "nara.rules", "nara.experiments", "nara.evaluation", "nara.tools"]
package-dir = {nara = "src"}

[tool.setuptools.package-data]
"nara.inference" = ["*.json", "*.txt"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
